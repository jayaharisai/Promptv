services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: sh -c "uv sync && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://promptv:promptv_local_development_only@db:5432/promptv
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/status')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  storybook:
    build:
      context: .
      target: dev
    command: sh -c "pnpm install --force --frozen-lockfile && pnpm storybook"
    ports:
      - '6006:6006'
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local

volumes:
  postgres_data:
  redis_data:
